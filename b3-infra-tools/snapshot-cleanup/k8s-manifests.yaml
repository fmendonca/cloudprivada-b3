---
apiVersion: v1
kind: Namespace
metadata:
  name: petrobras-infra-tools
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: snapshot-cleaner-sa
  namespace: petrobras-infra-tools
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: snapshot-cleaner-role
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["get", "list"]
  - apiGroups: ["snapshot.kubevirt.io"]
    resources: ["virtualmachinesnapshots"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["snapshot.kubevirt.io"]
    resources: ["virtualmachinesnapshotcontents"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: snapshot-cleaner-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: snapshot-cleaner-role
subjects:
  - kind: ServiceAccount
    name: snapshot-cleaner-sa
    namespace: petrobras-infra-tools
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: snapshot-cleaner-config
  namespace: petrobras-infra-tools
data:
  SNAPSHOT_RETENTION_HOURS: "30" 
  EXCLUDED_VM_TAGS: "backup=permanente"
  DRY_RUN: "false"
  NAMESPACE: ""  # Deixe vazio para todos os namespaces
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: snapshot-cleaner-cronjob
  namespace: petrobras-infra-tools
spec:
  # Executar a cada 6 horas (mais frequente para políticas baseadas em horas)
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: snapshot-cleaner
        spec:
          serviceAccountName: snapshot-cleaner-sa
          restartPolicy: OnFailure
          containers:
            - name: snapshot-cleaner
              image: quay.io/fcalomen/snapshot-cleaner:latest
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: snapshot-cleaner-config
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
---
# Job manual para testes
apiVersion: batch/v1
kind: Job
metadata:
  name: snapshot-cleaner-manual
  namespace: petrobras-infra-tools
spec:
  template:
    metadata:
      labels:
        app: snapshot-cleaner
    spec:
      serviceAccountName: snapshot-cleaner-sa
      restartPolicy: Never
      containers:
        - name: snapshot-cleaner
          image: quay.io/fcalomen/snapshot-cleaner:latest
          imagePullPolicy: Always
          env:
            - name: SNAPSHOT_RETENTION_HOURS
              value: "24"  # 1 dia para teste
            - name: EXCLUDED_VM_TAGS
              value: "backup=permanent"
            - name: DRY_RUN
              value: "false"  # Mude para false quando estiver pronto
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
