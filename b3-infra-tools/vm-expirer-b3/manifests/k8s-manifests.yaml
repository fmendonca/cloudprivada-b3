---
apiVersion: v1
kind: Namespace
metadata:
  name: infra-tools
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vm-expirer-sa
  namespace: infra-tools
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vm-expirer-role
rules:
- apiGroups: ["kubevirt.io"]
  resources: ["virtualmachines"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vm-expirer-binding
subjects:
- kind: ServiceAccount
  name: vm-expirer-sa
  namespace: infra-tools
roleRef:
  kind: ClusterRole
  name: vm-expirer-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-expirer
  namespace: infra-tools
  labels:
    app: vm-expirer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vm-expirer
  template:
    metadata:
      labels:
        app: vm-expirer
    spec:
      serviceAccountName: vm-expirer-sa
      containers:
      - name: vm-expirer
        image: quay.io/fcalomen/vm-expirer:1.0.1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vm-expirer
  namespace: infra-tools
  labels:
    app: vm-expirer
spec:
  selector:
    app: vm-expirer
  ports:
    - name: http
      port: 80
      targetPort: 8080 
      protocol: TCP
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vm-expirer
  namespace: infra-tools
  labels:
    app: vm-expirer
spec:
  to:
    kind: Service
    name: vm-expirer
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
  wildcardPolicy: None